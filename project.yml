name: ScheduleCountdown
options:
  bundleIdPrefix: com.namtran
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.1"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  ScheduleCountdown:
    type: application
    platform: macOS
    sources:
      - ScheduleCountdown
      # Shown in Settings → What's New.
      - path: CHANGELOG.md
        buildPhase: resources
    dependencies:
      - package: Sparkle
    info:
      path: ScheduleCountdown/Info.plist
      properties:
        CFBundleDisplayName: ScheduleCountdown
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # Menu bar only: no Dock icon, no app menu.
        LSUIElement: true
        # URL of the master schedule.json, served by the website (school Wi-Fi blocks GitHub). Empty = use the bundled copy only.
        ScheduleRemoteURL: https://bell.namatran.com/schedule.json
        # Sparkle app updates. The appcast is uploaded with each GitHub Release (scripts/release.sh).
        SUFeedURL: https://github.com/namatran/ScheduleCountdown/releases/latest/download/appcast.xml
        SUPublicEDKey: t1H0D/iH7ZbV3Tmidu/ERxWwgVyzUTRrEroC1B372hg=
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.namtran.ScheduleCountdown
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ScheduleCountdownTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ScheduleCountdownTests
    dependencies:
      - target: ScheduleCountdown
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.namtran.ScheduleCountdownTests
schemes:
  ScheduleCountdown:
    build:
      targets:
        ScheduleCountdown: all
        ScheduleCountdownTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ScheduleCountdownTests
