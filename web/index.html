<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bell Countdown</title>
  <meta name="description" content="How long until the next bell at Klein High.">
  <link rel="icon" href="images/bell.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
  <script>try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <nav class="devbar" id="devbar" hidden></nav>

  <main>
    <section class="hero">
      <p class="bookmark-hint" id="bookmark-hint" hidden>Press&nbsp;<kbd class="mod">Ctrl</kbd>&nbsp;+&nbsp;<kbd>D</kbd>&nbsp;to bookmark this page <button type="button" aria-label="Hide tip">×</button></p>
      <p class="disclaimer">Made by a Klein High student. Not an official Klein ISD site.</p>

      <div class="now">
        <p class="eyebrow" id="eyebrow">&nbsp;</p>
        <p class="countdown" id="countdown">--:--</p>
        <p class="caption" id="caption">&nbsp;</p>
      </div>

      <div class="corner left">
        <button class="pill" popovertarget="schedule"><span class="long">View&nbsp;</span><span class="cap">schedule</span></button>

        <details class="brief" id="brief" open>
          <summary>
            <h2><span class="long">Bearkat </span><span class="cap">Brief</span></h2>
            <span class="chev" aria-hidden="true"></span>
          </summary>
          <div class="brief-body">
            <ul id="briefs"></ul>
            <p class="updated" id="updated"></p>
          </div>
        </details>
      </div>

      <div class="corner right">
        <div class="lunch" role="group" aria-label="Your lunch">
          <span class="lunch-label">Lunch</span>
          <span class="seg">
            <button type="button" data-lunch="A">A</button>
            <button type="button" data-lunch="B">B</button>
            <button type="button" data-lunch="C">C</button>
          </span>
        </div>
        <a class="pill mac-link" href="mac/">Mac app</a>
        <button class="pill theme-toggle" id="theme-toggle" type="button" aria-label="Dark mode" aria-pressed="false">
          <svg class="moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
          <svg class="sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </section>

    <div class="sheet" id="schedule" popover="manual">
      <h2 id="sheet-title"></h2>
      <ol class="blocks" id="blocks"></ol>
    </div>
  </main>
</body>
</html>
