<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bell Countdown</title>
  <meta name="description" content="How long until the next bell at Klein High.">
  <link rel="icon" href="images/bell.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <nav class="devbar" id="devbar" hidden></nav>

  <main>
    <section class="hero">
      <div class="now">
        <p class="eyebrow" id="eyebrow">&nbsp;</p>
        <p class="countdown" id="countdown">--:--</p>
        <p class="caption" id="caption">&nbsp;</p>
      </div>

      <div class="corner left">
        <button class="pill" popovertarget="schedule"><span class="long">View&nbsp;</span><span class="cap">schedule</span></button>

        <details class="brief" id="brief" open>
          <summary>
            <h2><span class="long">Bearkat </span><span class="cap">Brief</span></h2>
            <span class="chev" aria-hidden="true"></span>
          </summary>
          <div class="brief-body">
            <ul id="briefs"></ul>
            <p class="updated" id="updated"></p>
          </div>
        </details>
      </div>

      <div class="corner right">
        <div class="lunch" role="group" aria-label="Your lunch">
          <span class="lunch-label">Lunch</span>
          <span class="seg">
            <button type="button" data-lunch="A">A</button>
            <button type="button" data-lunch="B">B</button>
            <button type="button" data-lunch="C">C</button>
          </span>
        </div>
        <a class="pill" href="mac/">Mac app</a>
      </div>
    </section>

    <div class="sheet" id="schedule" popover>
      <h2 id="sheet-title"></h2>
      <ol class="blocks" id="blocks"></ol>
    </div>
  </main>
</body>
</html>
